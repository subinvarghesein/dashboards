name: Update market data

on:
  schedule:
    - cron: "0 10 * * *"  # full refresh, at the NSE close (15:30 IST)
    - cron: "0 0 * * *"   # at the Tokyo open (09:00 JST), retry only what the full refresh couldn't fetch
  workflow_dispatch:

permissions:
  contents: write

# A rate-limited full refresh can run long; queue the retry behind it so it
# sees the pending list that run commits.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "0 0 * * *" ]; then
            python3 update_data.py --retry-pending
          else
            python3 update_data.py
          fi
      # Runs even if the retry exits non-zero, so partial progress is kept.
      - name: Commit refreshed data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add markets.html
          git commit -m "Update market data" || exit 0
          git push
